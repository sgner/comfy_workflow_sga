<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#64748b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#059669"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#ef4444"/>
    </marker>
    <filter id="s" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0001"/>
    </filter>
  </defs>

  <rect width="680" height="580" fill="#f8fafc" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">权限检查流程</text>

  <!-- Start -->
  <rect x="240" y="45" width="200" height="36" rx="18" fill="#6366f1" filter="url(#s)"/>
  <text x="340" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">工具调用请求</text>

  <line x1="340" y1="81" x2="340" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Check 1: bypassPermissions -->
  <rect x="200" y="105" width="280" height="40" rx="6" fill="#fff" stroke="#ef4444" stroke-width="1.5" filter="url(#s)"/>
  <text x="340" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">1. mode === bypassPermissions ?</text>

  <!-- Yes → allow -->
  <line x1="480" y1="125" x2="570" y2="125" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="520" y="118" text-anchor="middle" font-size="9" fill="#059669">是</text>
  <rect x="570" y="108" width="80" height="34" rx="6" fill="#059669" filter="url(#s)"/>
  <text x="610" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">允许</text>

  <!-- No → next -->
  <line x1="340" y1="145" x2="340" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="162" font-size="9" fill="#64748b">否</text>

  <!-- Check 2: auto mode -->
  <rect x="200" y="170" width="280" height="40" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#s)"/>
  <text x="340" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">2. mode === auto ?</text>

  <!-- Yes → check deny first -->
  <line x1="480" y1="190" x2="540" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <text x="505" y="183" text-anchor="middle" font-size="9" fill="#3b82f6">是</text>
  <rect x="540" y="170" width="120" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="600" y="188" text-anchor="middle" font-size="9" fill="#1e40af">先检查 deny</text>
  <text x="600" y="202" text-anchor="middle" font-size="9" fill="#1e40af">其余允许</text>

  <!-- No → next -->
  <line x1="340" y1="210" x2="340" y2="235" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="227" font-size="9" fill="#64748b">否</text>

  <!-- Check 3: deny rules -->
  <rect x="200" y="235" width="280" height="40" rx="6" fill="#fff" stroke="#ef4444" stroke-width="1.5" filter="url(#s)"/>
  <text x="340" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">3. 匹配 deny 规则？</text>

  <!-- Yes → deny -->
  <line x1="480" y1="255" x2="570" y2="255" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="520" y="248" text-anchor="middle" font-size="9" fill="#ef4444">是</text>
  <rect x="570" y="238" width="80" height="34" rx="6" fill="#ef4444" filter="url(#s)"/>
  <text x="610" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">拒绝</text>

  <!-- No → next -->
  <line x1="340" y1="275" x2="340" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="292" font-size="9" fill="#64748b">否</text>

  <!-- Check 4: allow rules -->
  <rect x="200" y="300" width="280" height="40" rx="6" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#s)"/>
  <text x="340" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">4. 匹配 allow 规则？</text>

  <!-- Yes → allow -->
  <line x1="480" y1="320" x2="570" y2="320" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="520" y="313" text-anchor="middle" font-size="9" fill="#059669">是</text>
  <rect x="570" y="303" width="80" height="34" rx="6" fill="#059669" filter="url(#s)"/>
  <text x="610" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">允许</text>

  <!-- No → next -->
  <line x1="340" y1="340" x2="340" y2="365" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="357" font-size="9" fill="#64748b">否</text>

  <!-- Check 5: ask rules -->
  <rect x="200" y="365" width="280" height="40" rx="6" fill="#fff" stroke="#d97706" stroke-width="1.5" filter="url(#s)"/>
  <text x="340" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">5. 匹配 ask 规则？</text>

  <!-- Yes → ask user -->
  <line x1="480" y1="385" x2="540" y2="385" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="505" y="378" text-anchor="middle" font-size="9" fill="#d97706">是</text>
  <rect x="540" y="365" width="110" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="595" y="383" text-anchor="middle" font-size="9" font-weight="500" fill="#92400e">询问用户</text>
  <text x="595" y="397" text-anchor="middle" font-size="9" fill="#92400e">→ 人机交互</text>

  <!-- No → next -->
  <line x1="340" y1="405" x2="340" y2="430" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="422" font-size="9" fill="#64748b">否</text>

  <!-- Check 6: plan mode -->
  <rect x="200" y="430" width="280" height="40" rx="6" fill="#fff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#s)"/>
  <text x="340" y="455" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">6. mode === plan 且为写操作？</text>

  <!-- Yes → ask -->
  <line x1="480" y1="450" x2="540" y2="450" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="443" text-anchor="middle" font-size="9" fill="#d97706">是</text>
  <rect x="540" y="432" width="110" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="595" y="455" text-anchor="middle" font-size="9" font-weight="500" fill="#92400e">需审批</text>

  <!-- No → default -->
  <line x1="340" y1="470" x2="340" y2="498" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="355" y="490" font-size="9" fill="#64748b">否</text>

  <!-- Default: ask user -->
  <rect x="240" y="498" width="200" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#s)"/>
  <text x="340" y="518" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">7. 默认：询问用户</text>
  <text x="340" y="532" text-anchor="middle" font-size="9" fill="#92400e">→ 触发人机交互流程</text>

  <text x="340" y="570" text-anchor="middle" font-size="9" fill="#94a3b8">SGA-Template Permission Check Flow</text>
</svg>
