<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>消息处理工作流 — SGA / Codex 双路径</title>
  <desc>用户消息 → 按 activeAgent 派发 → SGA 路径 (classify→tools→respond) 或 Codex 路径 (proxy→LLM→SSE 翻译) → 流式输出</desc>

  <defs>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="awI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="awE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="awA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00015010"/>
    </filter>
    <style>
      @keyframes dash { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
      .flow { stroke-dasharray: 6 4; animation: dash 1.5s linear infinite; }
      @keyframes breathe { 0%,100% { opacity: 0.9; } 50% { opacity: 1; } }
      .breathe { animation: breathe 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="820" fill="#f8fafc" rx="10"/>

  <!-- 标题 -->
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">消息处理工作流 — 双 Agent 路径</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#64748b">按 activeAgent 派发: SGA (indigo) / Codex (emerald) — 共享 Provider, 结果统一 SSE 输出</text>

  <!-- ===== 入口: 用户消息 ===== -->
  <rect x="360" y="75" width="240" height="50" rx="25" fill="url(#gIndigo)" filter="url(#sh)" class="breathe"/>
  <text x="480" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">用户消息 + 工作流</text>
  <text x="480" y="115" text-anchor="middle" font-size="10" fill="#e0e7ff">POST /api/v1/chat/stream</text>

  <line x1="480" y1="125" x2="480" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#aw)"/>

  <!-- ===== handleStreamResponse ===== -->
  <rect x="340" y="155" width="280" height="45" rx="8" fill="#fff" stroke="#475569" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">handleStreamResponse</text>
  <text x="480" y="190" text-anchor="middle" font-size="10" fill="#64748b">routes.ts — 按 activeAgent 派发</text>

  <line x1="480" y1="200" x2="480" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#aw)"/>

  <!-- ===== 决策: activeAgent? ===== -->
  <polygon points="480,225 560,265 480,305 400,265" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#sh)"/>
  <text x="480" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">activeAgent?</text>
  <text x="480" y="275" text-anchor="middle" font-size="10" fill="#92400e">session.activeAgent</text>

  <!-- 分支线 -->
  <path d="M 400 265 L 200 265 L 200 310" fill="none" stroke="#6366f1" stroke-width="2" class="flow" marker-end="url(#awI)"/>
  <text x="290" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#6366f1">SGA</text>

  <path d="M 560 265 L 760 265 L 760 310" fill="none" stroke="#10b981" stroke-width="2" class="flow" marker-end="url(#awE)"/>
  <text x="670" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#10b981">Codex</text>

  <!-- ============================================ -->
  <!-- 左路: SGA Agent (indigo)                     -->
  <!-- ============================================ -->
  <rect x="60" y="310" width="280" height="45" rx="8" fill="url(#gIndigo)" filter="url(#sh)" class="breathe"/>
  <text x="200" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">SGA: runAgent()</text>
  <text x="200" y="346" text-anchor="middle" font-size="10" fill="#e0e7ff">in-process · 直接调用 LLM</text>

  <line x1="200" y1="355" x2="200" y2="380" stroke="#6366f1" stroke-width="1.5" marker-end="url(#awI)"/>

  <!-- classify -->
  <rect x="80" y="380" width="240" height="40" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.4" filter="url(#sh)"/>
  <text x="200" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">classify_request</text>
  <text x="200" y="412" text-anchor="middle" font-size="9" fill="#64748b">诊断 / 解释 / 修改</text>

  <line x1="200" y1="420" x2="200" y2="440" stroke="#6366f1" stroke-width="1.5" marker-end="url(#awI)"/>

  <!-- 工具调用 -->
  <rect x="60" y="440" width="100" height="55" rx="8" fill="url(#gAmber)" filter="url(#sh)"/>
  <text x="110" y="463" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">github_search</text>
  <text x="110" y="478" text-anchor="middle" font-size="9" fill="#fef3c7">Issue 搜索</text>
  <text x="110" y="490" text-anchor="middle" font-size="9" fill="#fef3c7">解决方案</text>

  <rect x="170" y="440" width="100" height="55" rx="8" fill="url(#gAmber)" filter="url(#sh)"/>
  <text x="220" y="463" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">workflow</text>
  <text x="220" y="478" text-anchor="middle" font-size="9" fill="#fef3c7">analyzer</text>
  <text x="220" y="490" text-anchor="middle" font-size="9" fill="#fef3c7">JSON 分析</text>

  <rect x="280" y="440" width="100" height="55" rx="8" fill="url(#gAmber)" filter="url(#sh)"/>
  <text x="330" y="463" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">workflow</text>
  <text x="330" y="478" text-anchor="middle" font-size="9" fill="#fef3c7">action</text>
  <text x="330" y="490" text-anchor="middle" font-size="9" fill="#fef3c7">修改节点</text>

  <line x1="200" y1="495" x2="200" y2="520" stroke="#6366f1" stroke-width="1.5" marker-end="url(#awI)"/>

  <!-- coordinator -->
  <rect x="80" y="520" width="240" height="40" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.4" filter="url(#sh)"/>
  <text x="200" y="538" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">coordinator + planMgr</text>
  <text x="200" y="552" text-anchor="middle" font-size="9" fill="#64748b">多步规划 · 审批 · autoDream</text>

  <line x1="200" y1="560" x2="200" y2="585" stroke="#6366f1" stroke-width="1.5" marker-end="url(#awI)"/>

  <!-- generate_response -->
  <rect x="80" y="585" width="240" height="40" rx="8" fill="#0f766e" filter="url(#sh)"/>
  <text x="200" y="603" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">generate_response</text>
  <text x="200" y="617" text-anchor="middle" font-size="9" fill="#ccfbf1">聚合上下文 → 生成回复</text>

  <line x1="200" y1="625" x2="200" y2="660" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#awI)"/>

  <!-- ============================================ -->
  <!-- 右路: Codex Agent (emerald)                  -->
  <!-- ============================================ -->
  <rect x="620" y="310" width="280" height="45" rx="8" fill="url(#gEmerald)" filter="url(#sh)" class="breathe"/>
  <text x="760" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Codex: sendMessage()</text>
  <text x="760" y="346" text-anchor="middle" font-size="10" fill="#d1fae5">subprocess · JSON-RPC</text>

  <line x1="760" y1="355" x2="760" y2="380" stroke="#10b981" stroke-width="1.5" marker-end="url(#awE)"/>

  <!-- turn/start -->
  <rect x="640" y="380" width="240" height="40" rx="8" fill="#fff" stroke="#10b981" stroke-width="1.4" filter="url(#sh)"/>
  <text x="760" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">turn/start (JSON-RPC)</text>
  <text x="760" y="412" text-anchor="middle" font-size="9" fill="#64748b">发送 prompt → codex 子进程</text>

  <line x1="760" y1="420" x2="760" y2="445" stroke="#10b981" stroke-width="1.5" marker-end="url(#awE)"/>

  <!-- codex → proxy -->
  <rect x="640" y="445" width="240" height="50" rx="8" fill="#fff" stroke="#10b981" stroke-width="1.4" filter="url(#sh)"/>
  <text x="760" y="465" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">codex → Provider Proxy</text>
  <text x="760" y="480" text-anchor="middle" font-size="9" fill="#64748b">POST /v1/responses</text>
  <text x="760" y="490" text-anchor="middle" font-size="9" fill="#64748b">config.toml: requires_openai_auth=false</text>

  <line x1="760" y1="495" x2="760" y2="520" stroke="#10b981" stroke-width="1.5" marker-end="url(#awE)"/>

  <!-- proxy 翻译 -->
  <rect x="640" y="520" width="240" height="55" rx="8" fill="url(#gEmerald)" filter="url(#sh)"/>
  <text x="760" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Proxy 翻译</text>
  <text x="760" y="555" text-anchor="middle" font-size="9" fill="#d1fae5">Responses API → Chat Completions</text>
  <text x="760" y="568" text-anchor="middle" font-size="9" fill="#d1fae5">SSE: 注入 type 字段</text>

  <line x1="760" y1="575" x2="760" y2="600" stroke="#10b981" stroke-width="1.5" marker-end="url(#awE)"/>

  <!-- LLM 回复 -->
  <rect x="640" y="600" width="240" height="40" rx="8" fill="#fff" stroke="#10b981" stroke-width="1.4" filter="url(#sh)"/>
  <text x="760" y="618" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">LLM 流式回复</text>
  <text x="760" y="632" text-anchor="middle" font-size="9" fill="#64748b">Chat Completions SSE → 翻译回 Responses</text>

  <line x1="760" y1="640" x2="760" y2="660" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#awE)"/>

  <!-- ============================================ -->
  <!-- 合并: 事件桥接 + SSE 输出                    -->
  <!-- ============================================ -->

  <!-- SGA 事件 -->
  <rect x="80" y="660" width="240" height="40" rx="8" fill="#fff" stroke="#6366f1" stroke-width="1.2" filter="url(#sh)"/>
  <text x="200" y="678" text-anchor="middle" font-size="10" font-weight="600" fill="#4338ca">SGA 事件流</text>
  <text x="200" y="692" text-anchor="middle" font-size="9" fill="#64748b">text_delta · tool_call · approval</text>

  <!-- Codex 事件 -->
  <rect x="640" y="660" width="240" height="40" rx="8" fill="#fff" stroke="#10b981" stroke-width="1.2" filter="url(#sh)"/>
  <text x="760" y="678" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">Codex 事件桥接</text>
  <text x="760" y="692" text-anchor="middle" font-size="9" fill="#64748b">notification → stream_delta · turn_end</text>

  <!-- 合并线 -->
  <path d="M 200 700 L 200 730 L 480 730" fill="none" stroke="#6366f1" stroke-width="1.5" class="flow" marker-end="url(#awI)"/>
  <path d="M 760 700 L 760 730 L 480 730" fill="none" stroke="#10b981" stroke-width="1.5" class="flow" marker-end="url(#awE)"/>

  <!-- SSE 输出 -->
  <rect x="360" y="730" width="240" height="50" rx="25" fill="url(#gOut)" filter="url(#sh)" class="breathe"/>
  <text x="480" y="753" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">SSE 流式输出</text>
  <text x="480" y="770" text-anchor="middle" font-size="10" fill="#d1fae5">stream_delta → turn_end → done</text>

  <!-- 图例 -->
  <rect x="30" y="790" width="900" height="25" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="50" y="797" width="16" height="11" rx="3" fill="url(#gIndigo)"/>
  <text x="72" y="807" font-size="10" fill="#475569">SGA 路径</text>
  <rect x="140" y="797" width="16" height="11" rx="3" fill="url(#gEmerald)"/>
  <text x="162" y="807" font-size="10" fill="#475569">Codex 路径</text>
  <rect x="240" y="797" width="16" height="11" rx="3" fill="url(#gAmber)"/>
  <text x="262" y="807" font-size="10" fill="#475569">工具调用</text>
  <polygon points="350,803 358,795 366,803 358,811" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="376" y="807" font-size="10" fill="#475569">决策点</text>
  <rect x="440" y="797" width="16" height="11" rx="3" fill="url(#gOut)"/>
  <text x="462" y="807" font-size="10" fill="#475569">输出</text>
  <line x1="520" y1="803" x2="560" y2="803" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,4" class="flow"/>
  <text x="570" y="807" font-size="10" fill="#475569">数据流</text>
  <text x="900" y="807" text-anchor="end" font-size="9" fill="#94a3b8">comfy_workflow_agent v0.1.1</text>
</svg>
