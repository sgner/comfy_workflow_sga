<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>API 配置流程 — 三步接入 + 高级配置</title>
  <desc>验证地址 → 验证协议 → 拉取模型 → 保存. 失败才展开高级配置. SGA + Codex 共享 Provider Store.</desc>

  <defs>
    <linearGradient id="gStep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gDone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gAdv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="afB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="afR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00015010"/>
    </filter>
    <style>
      @keyframes dash { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
      .flow { stroke-dasharray: 6 4; animation: dash 1.5s linear infinite; }
      @keyframes breathe { 0%,100% { opacity: 0.9; } 50% { opacity: 1; } }
      .breathe { animation: breathe 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="960" height="560" fill="#f8fafc" rx="10"/>

  <!-- 标题 -->
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">API 配置流程 — 三步接入</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#64748b">验证地址 → 验证协议 → 拉取模型 → 保存. 失败才展开高级配置. SGA + Codex 共享.</text>

  <!-- ===== 顶部: 输入字段 ===== -->
  <rect x="40" y="75" width="200" height="55" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">平台名称</text>
  <text x="140" y="110" text-anchor="middle" font-size="9" fill="#64748b">如: DeepSeek / GLM</text>
  <text x="140" y="122" text-anchor="middle" font-size="9" fill="#64748b">显示名, 可自定义</text>

  <rect x="260" y="75" width="200" height="55" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="360" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">请求地址 (baseUrl)</text>
  <text x="360" y="110" text-anchor="middle" font-size="9" fill="#64748b">如: https://api.deepseek.com/v1</text>
  <text x="360" y="122" text-anchor="middle" font-size="9" fill="#64748b">OpenAI 兼容端点</text>

  <rect x="480" y="75" width="180" height="55" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="570" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">API Key</text>
  <text x="570" y="110" text-anchor="middle" font-size="9" fill="#64748b">sk-...</text>
  <text x="570" y="122" text-anchor="middle" font-size="9" fill="#64748b">供应商密钥</text>

  <rect x="680" y="75" width="240" height="55" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="800" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">协议类型</text>
  <text x="800" y="110" text-anchor="middle" font-size="9" fill="#64748b">OpenAI / Async / Gemini / CUI / Custom</text>
  <text x="800" y="122" text-anchor="middle" font-size="9" fill="#64748b">5 种协议可选</text>

  <!-- 箭头: 输入 → 步骤1 -->
  <line x1="140" y1="130" x2="140" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#afB)"/>
  <line x1="360" y1="130" x2="200" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#afB)"/>
  <line x1="570" y1="130" x2="260" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#afB)"/>
  <line x1="800" y1="130" x2="320" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#afB)"/>

  <!-- ===== 三步流程 ===== -->
  <!-- 步骤 1 -->
  <rect x="60" y="160" width="200" height="100" rx="12" fill="url(#gStep)" filter="url(#sh)" class="breathe"/>
  <text x="160" y="190" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">1</text>
  <text x="160" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">验证地址</text>
  <text x="160" y="234" text-anchor="middle" font-size="10" fill="#e0e7ff">baseUrl 是否可达</text>
  <text x="160" y="249" text-anchor="middle" font-size="9" fill="#c7d2fe">GET /models · 超时 10s</text>

  <line x1="260" y1="210" x2="300" y2="210" stroke="#3b82f6" stroke-width="2" class="flow" marker-end="url(#afB)"/>

  <!-- 步骤 2 -->
  <rect x="300" y="160" width="200" height="100" rx="12" fill="url(#gStep)" filter="url(#sh)" class="breathe"/>
  <text x="400" y="190" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">2</text>
  <text x="400" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">验证协议</text>
  <text x="400" y="234" text-anchor="middle" font-size="10" fill="#dbeafe">apiKey 是否有效</text>
  <text x="400" y="249" text-anchor="middle" font-size="9" fill="#bfdbfe">发送测试请求验证协议</text>

  <line x1="500" y1="210" x2="540" y2="210" stroke="#3b82f6" stroke-width="2" class="flow" marker-end="url(#afB)"/>

  <!-- 步骤 3 -->
  <rect x="540" y="160" width="200" height="100" rx="12" fill="url(#gStep)" filter="url(#sh)" class="breathe"/>
  <text x="640" y="190" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">3</text>
  <text x="640" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">拉取模型</text>
  <text x="640" y="234" text-anchor="middle" font-size="10" fill="#e0e7ff">从上游拉取模型列表</text>
  <text x="640" y="249" text-anchor="middle" font-size="9" fill="#c7d2fe">自动填充到下拉框</text>

  <line x1="740" y1="210" x2="780" y2="210" stroke="#10b981" stroke-width="2" class="flow" marker-end="url(#afB)"/>

  <!-- 保存 -->
  <rect x="780" y="170" width="140" height="80" rx="12" fill="url(#gDone)" filter="url(#sh)" class="breathe"/>
  <text x="850" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">保存</text>
  <text x="850" y="220" text-anchor="middle" font-size="10" fill="#d1fae5">设为默认 Provider</text>
  <text x="850" y="236" text-anchor="middle" font-size="10" fill="#d1fae5">SGA + Codex 共享</text>

  <!-- 失败 → 高级配置 -->
  <line x1="640" y1="260" x2="640" y2="300" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#afR)"/>
  <text x="660" y="285" font-size="10" font-weight="700" fill="#ef4444">失败?</text>

  <!-- 高级配置 -->
  <rect x="200" y="300" width="560" height="80" rx="10" fill="url(#gAdv)" filter="url(#sh)"/>
  <text x="480" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">高级配置 (仅验证失败时自动展开)</text>
  <text x="480" y="350" text-anchor="middle" font-size="11" fill="#fef3c7">自定义端点 · 自定义 Headers · Max Tokens · Temperature</text>
  <text x="480" y="368" text-anchor="middle" font-size="10" fill="#fde68a">默认折叠, 成功时隐藏, 减少认知负担</text>

  <!-- 回到步骤1 -->
  <path d="M 200 340 L 160 340 L 160 260" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#af)"/>
  <text x="120" y="305" font-size="9" fill="#92400e" font-weight="600">调整后重试</text>

  <!-- ===== Provider Store (共享) ===== -->
  <line x1="850" y1="250" x2="850" y2="400" stroke="#10b981" stroke-width="2" class="flow" marker-end="url(#afB)"/>

  <rect x="200" y="400" width="560" height="70" rx="10" fill="url(#gEmerald)" filter="url(#sh)" class="breathe"/>
  <text x="480" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Provider Store (全局共享)</text>
  <text x="480" y="445" text-anchor="middle" font-size="11" fill="#d1fae5">addProvider · getProvider · getDefaultProvider</text>
  <text x="480" y="460" text-anchor="middle" font-size="10" fill="#a7f3d0">SGA Agent 直接使用 · Codex Agent 经 Provider Proxy 使用 — 一套配置, 两个 Agent 共用</text>

  <!-- ===== 设计要点 ===== -->
  <rect x="30" y="490" width="900" height="60" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="46" y="510" font-size="11" font-weight="700" fill="#475569">设计要点</text>
  <text x="46" y="528" font-size="10" fill="#64748b">三步引导: 验证地址 → 验证协议 → 拉取模型, 逐步完成, 降低配置门槛</text>
  <text x="46" y="543" font-size="10" fill="#64748b">默认只显示 4 个核心字段 (名称/地址/Key/协议), 高级配置默认折叠, 仅失败时展开</text>
</svg>
